<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard · HotelMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const guests=HMS.getGuests(), inv=HMS.getInventory(), pays=HMS.getPayments();
const checkedIn=guests.filter(g=>g.status==='Checked-in').length;
const reserved=guests.filter(g=>g.status==='Reserved').length;
const low=inv.filter(i=>i.quantity>0 && i.quantity<=i.reorder).length;
const out=inv.filter(i=>i.quantity===0).length;
const revenue=pays.filter(p=>p.status==='Completed').reduce((s,p)=>s+p.paid,0);
const pending=pays.filter(p=>p.status==='Pending').reduce((s,p)=>s+(p.amount-p.paid),0);

const tile=(label,val,sub,accent)=>`
  <div class="card p-5">
    <div class="text-[12px] font-semibold uppercase tracking-wider text-[#7A7A7A]">${label}</div>
    <div class="kpi-num mt-2">${val}</div>
    <div class="text-[12px] text-${accent} mt-1 font-medium">${sub}</div>
  </div>`;

const body = `
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    ${tile('Guests in-house', checkedIn, reserved+' upcoming reservations','[#4A90E2]')}
    ${tile('Inventory alerts', low+out, low+' low · '+out+' out of stock','[#4A90E2]')}
    ${tile('Revenue (paid)', HMS.money(revenue),'Across '+pays.filter(p=>p.status==='Completed').length+' completed payments','[#047857]')}
    ${tile('Outstanding', HMS.money(pending), pays.filter(p=>p.status==='Pending').length+' pending payments','[#B45309]')}
  </div>
  <div class="card p-6">
    <h2 class="font-display text-lg font-bold mb-1">Your modules</h2>
    <p class="text-[13px] text-[#7A7A7A] mb-4">Jump straight into the area you manage.</p>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <a href="guests.html" class="block p-5 rounded-xl border border-[#E8E8E8] hover:border-[#4A90E2] hover:shadow-sm transition">
        <div class="icon-tile" style="background:#F3F4F6;color:#4A90E2">${HMSUI.icon('users')}</div>
        <div class="font-display font-bold mt-3">Guest Management</div>
        <div class="text-[13px] text-[#4D4D4D] mt-1">The hotel's guest memory — profiles, stay history & contact.</div>
      </a>
      <a href="inventory.html" class="block p-5 rounded-xl border border-[#E8E8E8] hover:border-[#4A90E2] hover:shadow-sm transition">
        <div class="icon-tile" style="background:#EFF6FF;color:#4A90E2">${HMSUI.icon('box')}</div>
        <div class="font-display font-bold mt-3">Inventory</div>
        <div class="text-[13px] text-[#4D4D4D] mt-1">Track linen, toiletries, beverages & cleaning supplies.</div>
      </a>
      <a href="payments.html" class="block p-5 rounded-xl border border-[#E8E8E8] hover:border-[#4A90E2] hover:shadow-sm transition">
        <div class="icon-tile" style="background:#ECFDF5;color:#047857">${HMSUI.icon('card')}</div>
        <div class="font-display font-bold mt-3">Payments</div>
        <div class="text-[13px] text-[#4D4D4D] mt-1">Revenue, pending balances & full payment history.</div>
      </a>
    </div>
  </div>`;
HMSUI.mount('dashboard','Welcome back, Jessica','Here\u2019s what\u2019s happening across your three modules today.',body);
</script>
</body></html>
