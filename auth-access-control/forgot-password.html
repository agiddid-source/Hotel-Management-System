<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | HotelMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-background min-h-screen flex items-center justify-center px-4 font-body">

  <div class="w-full max-w-md">

    <div class="bg-surface border border-border rounded-3xl p-8 shadow-sm">

      <!-- Logo -->
      <div class="text-center mb-8">
        <span class="font-heading text-2xl font-bold text-secondary">HotelMS</span>
      </div>

      <!-- Icon -->
      <div class="flex justify-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-background border border-border flex items-center justify-center">
          <i class="fa-regular fa-envelope text-secondary text-xl"></i>
        </div>
      </div>

      <!-- Heading -->
      <div class="text-center mb-8">
        <h1 class="font-heading text-3xl font-bold text-text mb-2">Forgot Password</h1>
        <p class="text-sm text-textSecondary leading-relaxed">
          Enter your email address and we'll send you a link to reset your password.
        </p>
      </div>

      <!-- Success Message -->
      <div id="successMessage" class="hidden items-center gap-3 mb-5 p-4 rounded-xl bg-successBg text-success text-sm font-medium">
        <i class="fa-solid fa-circle-check flex-shrink-0"></i>
        <span></span>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="hidden items-center gap-3 mb-5 p-4 rounded-xl bg-dangerBg text-danger text-sm font-medium">
        <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
        <span></span>
      </div>

      <!-- Form -->
      <form id="forgotPasswordForm" class="space-y-5">

        <div>
          <label for="email" class="block mb-1.5 text-sm font-medium text-text">
            Email Address
          </label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-textTertiary text-sm"></i>
            <input type="email" id="email" placeholder="you@hotelms.com" required
              class="w-full h-11 pl-10 pr-4 bg-background border border-border rounded-xl text-sm focus:outline-none focus:border-primary transition"
            >
          </div>
        </div>

        <button type="submit"
          class="w-full h-11 bg-secondary text-white rounded-xl text-sm font-medium hover:opacity-90 transition"
        >
          Send Reset Link
        </button>

      </form>

      <!-- Back to Login -->
      <div class="text-center mt-6">
        <a href="login.html" class="inline-flex items-center gap-2 text-sm text-textSecondary hover:text-text transition">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          Back to login
        </a>
      </div>

    </div>

  </div>

  <script src="js/auth/forgot-password.js"></script>

</body>
</html>
